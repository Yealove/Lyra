<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>好好听歌</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<div id="app">
  <div id="layout">
    <aside id="sidebar">
      <div class="nav-h">音乐库</div>
      <div class="nav-item on" id="nav-albums" onclick="go('albums')"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" width="15" height="15"><circle cx="12" cy="12" r="10"/><circle cx="12" cy="12" r="2"/></svg>专辑<span class="cnt" id="cntA"></span></div>
      <div class="nav-item" id="nav-artists" onclick="go('artists')"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" width="15" height="15"><path d="M12 2a3 3 0 0 0-3 3v7a3 3 0 0 0 6 0V5a3 3 0 0 0-3-3Z"/><path d="M19 10v2a7 7 0 0 1-14 0v-2"/><path d="M12 19v3"/></svg>艺术家<span class="cnt" id="cntR"></span></div>
      <div class="nav-item" id="nav-tracks" onclick="go('tracks')"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" width="15" height="15"><path d="M9 18V5l12-2v13"/><circle cx="6" cy="18" r="3"/><circle cx="18" cy="16" r="3"/></svg>曲目<span class="cnt" id="cntT"></span></div>
      <div class="nav-item" id="nav-folders" onclick="go('folders')"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" width="15" height="15"><path d="M20 20a2 2 0 0 0 2-2V8a2 2 0 0 0-2-2h-7.9a2 2 0 0 1-1.69-.9L9.6 3.9A2 2 0 0 0 7.93 3H4a2 2 0 0 0-2 2v13a2 2 0 0 0 2 2Z"/></svg>文件夹</div>      <div class="nav-h">智能歌单</div>
      <div class="nav-item" id="nav-favorites" onclick="go('smart','favorites')"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" width="15" height="15"><path d="M19 14c1.49-1.46 3-3.21 3-5.5A5.5 5.5 0 0 0 16.5 3c-1.76 0-3 .5-4.5 2-1.5-1.5-2.74-2-4.5-2A5.5 5.5 0 0 0 2 8.5c0 2.3 1.5 4.05 3 5.5l7 7Z"/></svg>收藏<span class="cnt" id="cntFav"></span></div>
      <div class="nav-item" id="nav-recent" onclick="go('smart','recent')"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" width="15" height="15"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/></svg>最近播放</div>
      <div class="nav-item" id="nav-top" onclick="go('smart','top')"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" width="15" height="15"><path d="M3 3v16a2 2 0 0 0 2 2h16"/><path d="M7 15l4-8 4 6 3-3 4 5"/></svg>最常播放</div>

      <div class="nav-h">歌单</div>
      <div id="plList"></div>
      <button id="newPlBtn" onclick="uiNewPlaylist()">＋ 新建歌单</button>
      <div class="nav-h">工具</div>
      <div class="nav-item" id="nav-stats" onclick="go('stats')"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" width="15" height="15"><path d="M3 3v16a2 2 0 0 0 2 2h16"/><path d="M18 17V9"/><path d="M13 17V5"/><path d="M8 17v-3"/></svg>统计</div>
      <div class="nav-item" id="nav-dups" onclick="go('dups')"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" width="15" height="15"><rect width="18" height="18" x="3" y="3" rx="2"/><path d="M8 8h8v8H8z" fill="currentColor" stroke="none" opacity=".45"/></svg>重复检测<span class="cnt" id="cntDup"></span></div>
      <!-- 歌词补全 / 元数据补全：批量入口暂时隐藏（体验不佳）；单首操作走曲目行「词」按钮与详情「元数据」 -->
      <div class="nav-item" id="nav-lyricsfetch" onclick="go('lyricsfetch')" hidden><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" width="15" height="15"><path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/></svg>歌词补全<span class="cnt" id="cntLF"></span></div>
      <div class="nav-item" id="nav-enrich" onclick="go('enrich')" hidden><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" width="15" height="15"><circle cx="11" cy="11" r="7"/><path d="m21 21-4.3-4.3"/><path d="M8 11h6"/><path d="M11 8v6"/></svg>元数据补全<span class="cnt" id="cntEn"></span></div>
      <div class="nav-item" id="nav-settings" onclick="go('settings')"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="3"/><path d="M4 12H2m20 0h-2M12 4V2m0 20v-2M5 5l1.5 1.5M17.5 17.5L19 19M19 5l-1.5 1.5M6.5 17.5L5 19"/></svg>设置</div>
      <div class="side-appearance">
        <div class="nav-h" style="padding-top:8px">外观</div>
        <button class="btn sm" style="width:100%;justify-content:center" id="sideThemeBtn" onclick="toggleThemeQuick()">☀ 切换亮色</button>
        <div class="side-accents" id="sideAccents"></div>
      </div>
    </aside>
    <div id="maincol">
      <header id="topbar">
        <div id="topLeft">
          <button class="back-btn" id="topBack" onclick="topBackGo()" title="返回">
            <svg class="ic-back" viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="m15 18-6-6 6-6"/></svg>
            <svg class="ic-home" viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m3 10 9-7 9 7v10a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/><path d="M9 22V12h6v10"/></svg>
          </button>
          <div class="crumb" id="crumb"></div>
        </div>
        <div id="searchWrap">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="7"/><path d="M21 21l-4.3-4.3"/></svg>
          <input id="searchBox" placeholder="搜索曲名 / 艺人 / 专辑…" oninput="onSearch(this.value)">
          <button id="searchClear" title="清除" hidden onclick="clearSearch()"><svg viewBox="0 0 24 24" width="12" height="12" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><path d="M18 6 6 18M6 6l12 12"/></svg></button>
        </div>
      </header>
      <main id="main"><div class="main-inner" id="view"></div></main>
    </div>
  </div>
  <footer id="playerbar">
    <div id="np" onclick="openTrackDetail()">
      <div id="npCover" style="cursor:pointer" title="点击展开歌词" onclick="event.stopPropagation();toggleLyrics()"></div>
      <div class="tt"><div class="t" id="npTitle">—</div><div class="a" id="npArtist"></div></div>
    </div>
    <div id="center">
      <div id="ctrls">
        <button class="pbtn side" id="btnEq" title="均衡器" onclick="openEq()"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" width="18" height="18"><path d="M4 4v5"/><path d="M4 15v5"/><path d="M12 4v9"/><path d="M12 19v1"/><path d="M20 4v13"/><circle cx="4" cy="12" r="2"/><circle cx="12" cy="15.5" r="2"/><circle cx="20" cy="19.5" r="2"/></svg></button>
        <button class="pbtn side" id="btnSpeed" title="播放速度" onclick="uiSpeed()">1.0x</button>
        <button class="pbtn side" id="btnSleep" title="睡眠定时" onclick="uiSleep()"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" width="18" height="18"><line x1="10" x2="14" y1="2" y2="2"/><line x1="12" x2="15" y1="14" y2="11"/><circle cx="12" cy="14" r="8"/></svg></button>
        <button class="pbtn" onclick="invoke('prev_track')" title="上一首"><svg viewBox="0 0 24 24" fill="currentColor"><path d="M6 5h2.5v14H6zM20 5v14L9.5 12z"/></svg></button>
        <button class="pbtn main" id="btnPlay" onclick="invoke('toggle_play')"></button>
        <button class="pbtn" onclick="invoke('next_track')" title="下一首"><svg viewBox="0 0 24 24" fill="currentColor"><path d="M15.5 5H18v14h-2.5zM4 5v14l10.5-7z"/></svg></button>
        <button class="pbtn side" id="btnRepeat" title="循环模式" onclick="uiRepeat()"><svg class="ic-rp" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" width="18" height="18"><path d="m17 2 4 4-4 4"/><path d="M3 11v-1a4 4 0 0 1 4-4h14"/><path d="m7 22-4-4 4-4"/><path d="M21 13v1a4 4 0 0 1-4 4H3"/></svg><svg class="ic-rp1" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" width="18" height="18"><path d="m17 2 4 4-4 4"/><path d="M3 11v-1a4 4 0 0 1 4-4h14"/><path d="m7 22-4-4 4-4"/><path d="M21 13v1a4 4 0 0 1-4 4H3"/><path d="M11 10h1v4"/></svg></button>
        <button class="pbtn side" id="btnAb" title="A-B 循环：设 A 点" onclick="uiAbLoop()" style="font-size:11px;font-weight:600;letter-spacing:.5px">A‑B</button>
        <button class="pbtn side" id="btnShuffle" title="随机播放：关（点击开启）" onclick="uiShuffle()"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" width="18" height="18"><path d="M2 18h1.4c1.3 0 2.5-.6 3.3-1.7l6.1-8.6c.8-1.1 2-1.7 3.3-1.7H22"/><path d="m18 2 4 4-4 4"/><path d="M2 6h1.9c1.5 0 2.9.9 3.6 2.2"/><path d="M22 18h-5.9c-1.3 0-2.6-.7-3.3-1.8l-.5-.8"/><path d="m18 14 4 4-4 4"/></svg></button>
      </div>
      <div id="progRow">
        <span class="time" id="tCur">0:00</span>
      <div id="progWrap" onclick="seekClk(event)"><div id="progTrack"><div id="abMarks"></div><div id="progFill"></div><div id="progDot"></div></div></div>
        <span class="time r" id="tDur">0:00</span>
      </div>
    </div>
    <div id="rightbar">
      <button class="pbtn" id="btnQueue" title="队列" onclick="toggleDrawer()"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" width="18" height="18"><path d="M3 6h13"/><path d="M3 12h13"/><path d="M3 18h9"/><circle cx="18.5" cy="17.5" r="2.5"/><path d="M21 15V6"/></svg></button>
      <button class="pbtn" id="btnLyrics" title="歌词" onclick="toggleLyrics()"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" width="18" height="18"><path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/></svg></button>
      <button class="pbtn" id="btnVol" title="音量（点击静音，悬停调节）" onclick="toggleMute()">
        <svg id="volIcon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M11 5L6 9H2v6h4l5 4zM15.5 8.5a5 5 0 0 1 0 7"/></svg>
      </button>
    </div>
  </footer>
</div>
<div id="drawer">
  <div class="dh">
    <div class="q-tabs">
      <div class="q-tab on" id="qTabQueue" onclick="switchDrawerTab('queue')">播放队列</div>
      <div class="q-tab" id="qTabAlbum" onclick="switchDrawerTab('album')">当前专辑</div>
    </div>
    <span class="muted" id="qCount"></span><span class="grow"></span>
    <button class="btn sm" id="qClearBtn" onclick="clearQueue()">清空</button>
  </div>
  <div class="list" id="qList"></div>
  <div class="list" id="aList" style="display:none"></div>
</div>
<div id="lyrics">
  <div id="lyBg"></div>
  <button class="ly-close" style="position:absolute;top:26px;right:28px;z-index:3" title="收起歌词页" onclick="toggleLyrics()"><svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M18 6 6 18"/><path d="m6 6 12 12"/></svg></button>
  <div id="lyLayout">
    <div id="vinylWrap">
      <div id="vinyl">
        <div id="vinylDisc">
          <div class="vinyl-grooves"></div>
          <div id="vinylCover"></div>
        </div>
        <svg id="vinylArm" viewBox="0 0 100 120">
          <defs>
            <radialGradient id="ta-base" cx="30%" cy="30%">
              <stop offset="0%" stop-color="#999"/><stop offset="100%" stop-color="#444"/>
            </radialGradient>
            <linearGradient id="ta-arm" x1="0%" y1="0%" x2="0%" y2="100%">
              <stop offset="0%" stop-color="#bbb"/><stop offset="50%" stop-color="#888"/><stop offset="100%" stop-color="#666"/>
            </linearGradient>
            <linearGradient id="ta-head" x1="0%" y1="0%" x2="0%" y2="100%">
              <stop offset="0%" stop-color="#555"/><stop offset="100%" stop-color="#222"/>
            </linearGradient>
          </defs>
          <circle cx="87.5" cy="12" r="11" fill="url(#ta-base)"/>
          <circle cx="87.5" cy="12" r="6" fill="#333"/>
          <rect x="12" y="9" width="76" height="6" rx="3" fill="url(#ta-arm)"/>
          <rect x="4" y="5" width="12" height="18" rx="2" fill="url(#ta-head)"/>
          <polygon points="10,23 5,35 15,35" fill="#888"/>
          <circle cx="10" cy="32" r="1.5" fill="#aaa"/>
        </svg>
      </div>
    </div>
    <div id="lyRight">
      <div id="lyHero">
        <div class="t" id="lyTitle"></div>
        <div class="a" id="lyArtist"></div>
      </div>
      <div id="lyLines"></div>
      <div id="lyOffBox"></div>
    </div>
  </div>
</div>
<div id="modalRoot" onclick="if(event.target===this)closeModal()"></div>
<div id="menuRoot"></div>
<div id="selBar" style="display:none"></div>
<div id="toastRoot"></div>
<script src="app.js"></script>
</body>
</html>
