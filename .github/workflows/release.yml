name: Release

# 推 v* 标签触发：三平台并行构建，产物自动挂到 GitHub Release
on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          # macOS：Apple Silicon + Intel 各出一个 .dmg
          - platform: macos-latest
            target: aarch64-apple-darwin
          - platform: macos-latest
            target: x86_64-apple-darwin
          - platform: ubuntu-22.04
            target: ''
          - platform: windows-latest
            target: ''

    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: 安装 Linux 系统依赖
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev libgtk-3-dev libayatana-appindicator3-dev \
            librsvg2-dev libasound2-dev patchelf

      - name: Rust 缓存
        uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: 构建并发布
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          # 仅标签构建创建/关联 Release；手动触发（workflow_dispatch）只构建不发布
          tagName: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || '' }}
          releaseName: ${{ startsWith(github.ref, 'refs/tags/') && format('好好听歌 {0}', github.ref_name) || '' }}
          releaseBody: '见 Release Notes。macOS 首次打开：右键 → 打开（未签名构建）。'
          releaseDraft: true
          prerelease: false
          args: ${{ matrix.target && format('--target {0}', matrix.target) || '' }}
          # productName=好好听歌（中文）时 GitHub 会剥离资产名中的非 ASCII 字符
          # （v0.1.1/v0.1.4 实测丢前缀），用官方 pattern 强制 ASCII 命名：
          # [ext] 自带前导点；[_setup] 仅 NSIS 生效；macOS 更新包 .app.tar.gz 的
          # [arch] 按构建 target 精确取 aarch64/x64
          releaseAssetNamePattern: 'Lyra_[version]_[arch][_setup][ext]'
