name: Release

# 推 v* 标签触发：三平台并行构建，产物自动挂到 GitHub Release
on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          # macOS：Apple Silicon + Intel 各出一个 .dmg
          - platform: macos-latest
            target: aarch64-apple-darwin
          - platform: macos-latest
            target: x86_64-apple-darwin
          - platform: ubuntu-22.04
            target: ''
          - platform: windows-latest
            target: ''

    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: 安装 Linux 系统依赖
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev libgtk-3-dev libayatana-appindicator3-dev \
            librsvg2-dev libasound2-dev patchelf

      - name: Rust 缓存
        uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: 构建并发布
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          # 仅标签构建创建/关联 Release；手动触发（workflow_dispatch）只构建不发布
          tagName: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || '' }}
          releaseName: ${{ startsWith(github.ref, 'refs/tags/') && format('好好听歌 {0}', github.ref_name) || '' }}
          releaseBody: '见 Release Notes。macOS 首次打开：右键 → 打开（未签名构建）。'
          releaseDraft: true
          prerelease: false
          args: ${{ matrix.target && format('--target {0}', matrix.target) || '' }}

  # productName 为中文（好好听歌）时 tauri-action 上传资产会丢前缀（v0.1.1 实测），
  # 统一改为 Lyra 前缀重新上传；Linux 已覆盖 ASCII productName，本 job 对其无操作
  fix-assets:
    needs: build
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    steps:
      - name: 修正资产名
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="${GITHUB_REF_NAME}"
          REPO="${GITHUB_REPOSITORY}"
          mkdir -p assets
          gh release download "$TAG" --repo "$REPO" --dir assets --clobber --pattern "_*" --pattern "好好听歌*"
          for f in assets/_* assets/好好听歌*; do
            [ -e "$f" ] || continue
            base="$(basename "$f")"
            case "$base" in
              _*) new="Lyra${base}" ;;
              好好听歌*) new="Lyra${base#好好听歌}" ;;
              *) continue ;;
            esac
            mv "$f" "assets/$new"
            gh release upload "$TAG" --repo "$REPO" --clobber "assets/$new"
            gh release delete-asset "$base" --repo "$REPO" --yes
          done
          echo "剩余资产："
          gh release view "$TAG" --repo "$REPO" --json assets --jq '.assets[].name'
